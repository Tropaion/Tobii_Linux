[package]
name = "tobii-update"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Checks for, verifies and installs new releases of the Tobii ET5 Linux runtime."

[dependencies]
tobii-config = { path = "../tobii-config" }
# faccessat and geteuid: asking the kernel whether a directory is writable
# without creating a file in it. See `install::placement`.
libc = "0.2"
