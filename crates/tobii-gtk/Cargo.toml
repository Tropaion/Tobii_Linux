[package]
name = "tobii-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTK4 configuration GUI for the Tobii ET5 Linux runtime."

[lib]
name = "tobii_gtk"
path = "src/lib.rs"

[[bin]]
name = "tobii-gtk"
path = "src/main.rs"

[dependencies]
tobii-protocol = { path = "../tobii-protocol" }
tobii-usb = { path = "../tobii-usb" }
tobii-config = { path = "../tobii-config" }
tobii-diagnostics = { path = "../tobii-diagnostics" }
tobii-headpose = { path = "../tobii-headpose" }
tobii-update = { path = "../tobii-update" }
# The socket the hub serves tracking data on. NOT tobii-output: this commit is
# the demand seam alone, with no router, no sinks and no frames.
tobii-ipc = { path = "../tobii-ipc" }
# The routing layer: Extended View, the sinks, and the shared compose pipeline.
tobii-output = { path = "../tobii-output" }
# What Steam says is installed, and where a game's Proton prefix is. Read-only,
# zero dependencies of its own.
tobii-steam = { path = "../tobii-steam" }
# The readers for a game's OWN configuration files. It never writes, and the
# game-setup window is a caller that keeps the same promise one layer up: there
# is no button anywhere in it that changes a game's files.
tobii-gameconf = { path = "../tobii-gameconf" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
