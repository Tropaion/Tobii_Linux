[package]
name = "tobii-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the Tobii ET5 Linux runtime."

[[bin]]
name = "tobii"
path = "src/main.rs"

[dependencies]
tobii-usb = { path = "../tobii-usb" }
tobii-protocol = { path = "../tobii-protocol" }
tobii-config = { path = "../tobii-config" }
tobii-update = { path = "../tobii-update" }
tobii-headpose = { path = "../tobii-headpose", default-features = false }

[features]
# Mirrors `tobii-headpose`'s. With this off, `tobii headpose` is the 5-DOF
# eye-origin path exactly as it was, and the neural model is not compiled in.
default = ["onnx"]
onnx = ["tobii-headpose/onnx"]
