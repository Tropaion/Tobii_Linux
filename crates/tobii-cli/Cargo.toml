[package]
name = "tobii-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the Tobii ET5 Linux runtime."

[[bin]]
name = "tobii"
path = "src/main.rs"

[dependencies]
tobii-usb = { path = "../tobii-usb" }
tobii-protocol = { path = "../tobii-protocol" }
tobii-config = { path = "../tobii-config" }
tobii-diagnostics = { path = "../tobii-diagnostics" }
# Zero new external crates: tobii-output's only dependencies are tobii-config,
# tobii-headpose and tobii-protocol, all of which are already here. It takes
# tobii-headpose with default-features off, so this crate's own `onnx` feature
# still decides whether tract-onnx compiles.
tobii-output = { path = "../tobii-output" }
# For `tobii game`: hold the hub's tracking socket open for a child process.
tobii-ipc = { path = "../tobii-ipc" }
tobii-update = { path = "../tobii-update" }
tobii-headpose = { path = "../tobii-headpose", default-features = false }
# For `tobii uninstall`'s O_NOFOLLOW | O_NONBLOCK opens. Already in the tree
# through tobii-update and tobii-output.
libc = "0.2"

[features]
# Mirrors `tobii-headpose`'s. With this off, `tobii headpose` is the 5-DOF
# eye-origin path exactly as it was, and the neural model is not compiled in.
default = ["onnx"]
onnx = ["tobii-headpose/onnx"]
