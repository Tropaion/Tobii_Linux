# Build a release and publish it.
#
# # Why this exists at all
#
# The machine a binary is compiled on *is* its compatibility floor, and a
# developer's machine is the worst possible choice. Measured on the maintainer's
# (glibc 2.44, September 2026):
#
#     tobii      GLIBC_2.44
#     tobii-gtk  GLIBC_2.44
#
# Ubuntu 24.04 has 2.39 and Debian 13 has 2.41, so a release cut there would
# fail to start for very nearly everyone who downloaded it — and it would fail
# *loudly*, because `tobii-update` runs the new binary once before installing
# it, gets a dynamic-linker error, and reports "built against newer system
# libraries than this machine has" before rolling back. The updater would be
# blamed for working correctly.
#
# So releases are built in a Debian 13 container, which fixes the floor at
# glibc 2.41 whatever the maintainer happens to be running. `glibc-floor` below
# turns that from a hope into an enforced check.
#
# # How to cut a release
#
#     # 1. bump [workspace.package] version in Cargo.toml, commit
#     # 2. git tag v0.2.0 && git push origin v0.2.0
#
# `scripts/release.sh` refuses to build if the tag and Cargo.toml disagree,
# because a build that reports a different version than its tag offers itself
# its own update forever.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The oldest glibc this release may require. Debian 13 is 2.41; anything
  # higher means the container drifted and the release would be narrower than
  # intended, which is exactly the failure this workflow exists to prevent.
  MAX_GLIBC: "2.41"

jobs:
  build:
    name: Build in the compatibility container
    runs-on: ubuntu-latest
    container: debian:trixie
    # The validated version, for the arch job: GITHUB_ENV does not cross jobs.
    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      # The tag is the only untrusted input here — anyone able to push a tag
      # chooses its name, and it reaches a shell. It is validated against a
      # strict pattern before it is used for anything, and passed through the
      # environment rather than interpolated into a script.
      #
      # A pre-release suffix has to start with a LETTER (v1.0.0-rc1). The Arch
      # packages spell 1.0.0-rc1 as 1.0.0rc1, which vercmp sorts below 1.0.0,
      # as a pre-release should sort; a numeric suffix (v1.0.0-1) would become
      # 1.0.01, which vercmp sorts ABOVE 1.0.0 — so pacman would treat the
      # pre-release as an upgrade from its own release. scripts/package.sh and
      # scripts/aur-bin.sh apply the same pattern.
      - name: Check the tag is a version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][A-Za-z0-9.]*)?$' || {
            echo "tag '$TAG' is not vMAJOR.MINOR.PATCH with an optional suffix like -rc1 (starting with a letter)" >&2
            exit 1
          }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils ca-certificates curl git pkg-config \
            libgtk-4-dev libgtk4-layer-shell-dev libusb-1.0-0-dev \
            rpm

      - uses: actions/checkout@v5

      # The pinned toolchain from rust-toolchain.toml, so a release is built
      # with the same compiler the checks ran under.
      - name: Install the Rust toolchain
        run: |
          set -eux
          # `set -o pipefail` matters here: without it the exit status is sh's,
          # so a failed download pipes an empty script into a shell that exits 0
          # and the step goes green with no rustup installed. The failure then
          # surfaces later as "cargo: command not found".
          set -o pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The tests, before anything is built for publication.
      #
      # ci.yml runs these on every push to main and every pull request, but a
      # TAG is not either of those: it can point at a commit that never went
      # through main, at one whose CI run was still queued, or at one whose CI
      # run went red. Nothing downstream of here would notice — the archive
      # would build, the glibc gate would pass, and the draft would be waiting
      # with a broken binary in it. Running them here costs a couple of minutes
      # against a release that is cut a handful of times a year.
      - name: The checks, on the tagged commit
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          # The install scripts too. install.sh ships inside the archive, and the
          # reason these checks run here at all — a tag can point at a commit
          # whose CI never ran — applies to them as much as to the Rust.
          bash scripts/test-install-payload.sh

      # The same script a maintainer would run locally, so there is one
      # definition of what a release archive is. It builds, refuses on a
      # version mismatch, reports the glibc floor, runs `--version` on both
      # binaries (the same probe the updater uses), and writes SHA256SUMS.
      - name: Build the release archive
        run: scripts/release.sh "$VERSION"

      # The .deb, the .rpm and the PKGBUILD, from the SAME binaries the tarball
      # ships — package.sh unpacks the archive rather than reaching into
      # target/, so the two channels cannot diverge. It also rewrites
      # SHA256SUMS to cover everything in dist/, and writes
      # aur/tobii-linux-bin/PKGBUILD, which the arch job builds.
      - name: Build the distribution packages
        run: scripts/package.sh "$VERSION"

      # release.sh reports the floor; this makes it a gate. Without it, a
      # container image bump could silently narrow every future release and
      # nobody would notice until users could not start the binaries.
      #
      # bash, not the default sh: scripts/elf-deps.sh uses `local` and `[[ ]]`.
      - name: Check the glibc floor
        shell: bash
        run: |
          set -euo pipefail
          # The function the .deb, the .rpm and the Arch package take their
          # declared floor from, so the gate measures what they declare.
          # release.sh has already printed what each binary needs.
          . scripts/elf-deps.sh
          tmp="$(mktemp -d)"
          tar -xzf dist/tobii-linux-"$VERSION"-*.tar.gz -C "$tmp"
          worst="$(elf_glibc_floor "$tmp"/*/tobii "$tmp"/*/tobii-gtk)"
          # Measuring nothing is a failure, not a pass. If objdump is absent,
          # the binaries are missing, or the grep finds no versioned symbols,
          # `worst` stays empty and the comparison below would let ANY build
          # through — the one outcome this gate exists to prevent.
          if [ -z "$worst" ]; then
            echo "::error::could not determine the glibc floor — refusing to publish a release nobody has checked" >&2
            exit 1
          fi
          echo "archive floor: glibc $worst (limit $MAX_GLIBC)"
          if [ "$(printf '%s\n%s\n' "$worst" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::this build needs glibc $worst, above the $MAX_GLIBC limit — it would not start for most users" >&2
            exit 1
          fi

      # The archive floor above is measured from the binaries; this checks the
      # PACKAGES actually say so, and that they parse at all. It is here rather
      # than in package.sh because most developer machines have neither
      # `rpmbuild` nor `dpkg-deb`, so neither package can be read where it is
      # written — an unverifiable claim in a script is how `AutoReqProv: no`
      # sat there silently declaring nothing, and how a `#` comment got into a
      # deb control file, which is what failed the first v0.1.0 tag.
      #
      # Every failure names itself. The first version of this step used an
      # unguarded `ls dist/*.deb` and unchecked command substitutions under
      # `set -eu`, so a broken package surfaced as "exit code 2" with no clue
      # which command produced it.
      - name: Check the packages declare the glibc floor
        run: |
          set -eu
          echo "dist/ contains:"; ls -la dist/

          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          [ -n "$deb" ] || { echo "::error::no .deb in dist/"; exit 1; }
          if ! deps="$(dpkg-deb -f "$deb" Depends 2>&1)"; then
            echo "::error::dpkg-deb could not read $deb — the control file is malformed: $deps"
            exit 1
          fi
          echo "deb Depends: $deps"
          case "$deps" in
            *"libc6 (>= "*) ;;
            *) echo "::error::the .deb depends on libc6 with no version" >&2; exit 1 ;;
          esac

          rpm_file="$(find dist -maxdepth 1 -name '*.rpm' -print -quit)"
          if [ -z "$rpm_file" ]; then
            echo "::error::no .rpm in dist/ — rpmbuild is supposed to be installed here" >&2
            command -v rpmbuild || echo "rpmbuild is not on PATH"
            exit 1
          fi
          if ! reqs="$(rpm -qpR "$rpm_file" 2>&1)"; then
            echo "::error::rpm could not read $rpm_file: $reqs" >&2
            exit 1
          fi
          echo "rpm Requires:"; echo "$reqs"
          echo "$reqs" | grep -q 'libc\.so\.6(GLIBC_' || {
            echo "::error::the .rpm declares no versioned glibc requirement" >&2; exit 1; }
          echo "$reqs" | grep -q 'libgtk-4\.so' || {
            echo "::error::the .rpm declares no gtk4 soname" >&2; exit 1; }

      - name: Verify SHA256SUMS matches the archive
        run: cd dist && sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # The prebuilt Arch package's PKGBUILD, for the arch job. An artifact and
      # not a release asset: package.sh writes it to aur/, not dist/, because
      # everything in dist/ is hashed into SHA256SUMS and published, and a
      # second file named PKGBUILD would collide with the source one a v0.3.0
      # hub downloads by name.
      - uses: actions/upload-artifact@v4
        with:
          name: aur-pkgbuild
          path: aur/
          if-no-files-found: error
          retention-days: 7

  # The prebuilt Arch package, built and then installed on a clean Arch system.
  #
  # A job of its own because makepkg and pacman exist only on Arch, while the
  # binaries have to come from the Debian container, which is what fixes the
  # glibc floor. So nothing is compiled here: package.sh already wrote the
  # PKGBUILD (scripts/aur-bin.sh), and this repackages the tarball `build` made.
  #
  # makepkg finds that tarball in its start directory and still checks it
  # against the PKGBUILD's pin — the draft release's URL would 404, so the pin
  # is the only way that step can pass. pacman then installs the result on a
  # container that has never seen it, and both binaries must start from
  # /usr/bin with every library resolved.
  #
  # The .pkg.tar.zst joins the release, so this job writes the final
  # SHA256SUMS, and `publish` uploads what this job hands it.
  #
  # Every gate below is written so that finding the problem FAILS the step.
  # Under `bash -e`, a grep that finds nothing exits 1 — which is the pass
  # condition for some checks and the failure for others — so each one is an
  # explicit `if`, never a bare grep whose exit status decides.
  arch:
    name: Build and install the Arch package
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      # The tag without its v, validated by build's first step.
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: aur-pkgbuild
          path: aur

      # Mirrors flake, so every pacman call that downloads is retried.
      #
      # makepkg without -s stops when a `depends` entry is not installed, and
      # -s would need sudo. So they are installed here — read from the PKGBUILD
      # itself rather than listed a second time, which also proves each name in
      # aur-bin.sh's soname table is a package the Arch repositories have.
      - name: Update the system and install the package's dependencies
        run: |
          set -euo pipefail
          retry() {
            local i
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i of 5 failed: $*" >&2
              sleep $((i * 15))
            done
            return 1
          }
          retry pacman -Syu --noconfirm
          mapfile -t deps < <(bash -c 'source aur/tobii-linux-bin/PKGBUILD && printf "%s\n" "${depends[@]}"')
          if [ "${#deps[@]}" -eq 0 ]; then
            echo "::error::could not read depends= from aur/tobii-linux-bin/PKGBUILD" >&2
            exit 1
          fi
          echo "depends: ${deps[*]}"
          # 'glibc>=2.39' is a dependency, and pacman -S wants the package name.
          retry pacman -S --needed --noconfirm "${deps[@]%%[<>=]*}"

      # makepkg refuses to run as root. The tarball goes into the start
      # directory, where makepkg uses it instead of downloading it — and checks
      # it against sha256sums_x86_64 all the same.
      - name: Build the package as an unprivileged user
        run: |
          set -euo pipefail
          useradd -m builder
          install -d -o builder -g builder /home/builder/pkg
          cp aur/tobii-linux-bin/PKGBUILD aur/tobii-linux-bin/tobii-linux.install \
             "dist/tobii-linux-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" /home/builder/pkg/
          chown -R builder:builder /home/builder/pkg
          su builder -c 'cd ~/pkg && PKGEXT=.pkg.tar.zst makepkg --noconfirm && makepkg --printsrcinfo > .SRCINFO'

      - name: Check the package, install it, and run it
        run: |
          set -euo pipefail
          pkgver="${VERSION//-/}"
          want="tobii-linux-bin-${pkgver}-1-x86_64.pkg.tar.zst"

          # Exactly one package, named as the hub's matcher expects, and no
          # split -debug- package (options=('!debug') must be in effect). A
          # debug package is a second file, so the count catches it.
          mapfile -t built < <(find /home/builder/pkg -maxdepth 1 -name '*.pkg.tar*' -printf '%f\n' | sort)
          echo "makepkg produced: ${built[*]:-nothing}"
          if [ "${#built[@]}" -ne 1 ] || [ "${built[0]}" != "$want" ]; then
            echo "::error::expected exactly $want (a -debug- package means options=('!debug') is not in effect)" >&2
            exit 1
          fi

          # On a container that has never had it. Not retried: a local file
          # whose depends the step before installed downloads nothing, so a
          # failure here is the package's, and waiting would not change it.
          pacman -U --noconfirm "/home/builder/pkg/$want"

          # Both answer --version before any GTK or device code runs, so this
          # needs no display and no tracker.
          for bin in tobii tobii-gtk; do
            out="$("/usr/bin/$bin" --version)"
            echo "$out"
            if [ "$out" != "$bin $VERSION" ]; then
              echo "::error::/usr/bin/$bin --version printed '$out', not '$bin $VERSION'" >&2
              exit 1
            fi
          done

          # Captured, then searched: `ldd | grep -q` under pipefail can report
          # a MATCH as a failure (grep exits at the first hit and ldd dies of
          # SIGPIPE), and here that would pass the gate.
          libs="$(ldd /usr/bin/tobii /usr/bin/tobii-gtk)"
          if grep -q 'not found' <<<"$libs"; then
            echo "::error::a library the binaries need is missing after pacman -U, so depends= is incomplete:" >&2
            grep 'not found' <<<"$libs" >&2
            exit 1
          fi

          info="$(LC_ALL=C pacman -Qi tobii-linux-bin)"
          echo "$info"
          if ! grep -Eq '^Depends On +:.*glibc>=[0-9]' <<<"$info"; then
            echo "::error::the installed package declares no glibc>= dependency" >&2
            exit 1
          fi

      # SHA256SUMS is rewritten from scratch over every file in dist/, not
      # appended to: a list kept by hand is how a file ends up published and
      # unlisted.
      - name: Add the package to the release and rewrite SHA256SUMS
        run: |
          set -euo pipefail
          export LC_ALL=C
          cp "/home/builder/pkg/tobii-linux-bin-${VERSION//-/}-1-x86_64.pkg.tar.zst" dist/
          cd dist
          # `gh release create dist/*` uploads files; anything else breaks it.
          others="$(find . -mindepth 1 -maxdepth 1 ! -type f)"
          if [ -n "$others" ]; then
            echo "::error::dist/ holds something that is not a plain file: $others" >&2
            exit 1
          fi
          # The build job's list, checked BEFORE it is replaced: every file it
          # covers must be unchanged in this container, and the one file it does
          # not cover must be the package this job just added. Rewriting it
          # without this would bless any change made to those files here.
          sha256sum -c SHA256SUMS
          pkg="tobii-linux-bin-${VERSION//-/}-1-x86_64.pkg.tar.zst"
          unlisted="$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort \
            | comm -23 - <(sed -E 's/^[0-9a-f]{64}  //' SHA256SUMS | sort))"
          if [ "$unlisted" != "$pkg" ]; then
            echo "::error::files the build job's SHA256SUMS does not list: '$unlisted' (expected only $pkg)" >&2
            exit 1
          fi
          rm -f SHA256SUMS
          # Captured first, so the list is complete before SHA256SUMS exists.
          sums="$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 -r sha256sum)"
          printf '%s\n' "$sums" > SHA256SUMS
          cat SHA256SUMS

          # Complete by construction: the list above is every plain file here.
          # What is left to check is that each name survives upload: GitHub
          # rewrites characters such as '~' in an asset's name to '.', after
          # which the published name is one SHA256SUMS does not list, and the
          # updater refuses it (NotListed). The same check rejects every name
          # sha256sum would have escaped in the list (a backslash, a newline).
          bad=0
          for f in *; do
            if [ "$f" = SHA256SUMS ]; then continue; fi
            case "$f" in
              *[!A-Za-z0-9._-]*)
                echo "::error::$f has a character GitHub rewrites in asset names" >&2
                bad=1 ;;
            esac
          done

          # NAMES. Every asset a hub's matcher looks for
          # (crates/tobii-update/src/release.rs), exactly once. A file present
          # under a name no matcher accepts is a channel that silently offers
          # nothing, and two that match leave the choice to listing order.
          shopt -s nullglob
          one() {
            local what="$1"
            shift
            if [ "$#" -ne 1 ]; then
              echo "::error::expected exactly one $what in dist/, found $#: $*" >&2
              return 1
            fi
            echo "ok  $what: $1"
          }
          one "archive for x86_64-unknown-linux-gnu" ./*-x86_64-unknown-linux-gnu.tar.gz || bad=1
          one ".deb for dpkg (amd64)" ./*_amd64.deb || bad=1
          one ".rpm for rpm (x86_64)" ./*.x86_64.rpm || bad=1
          one "prebuilt package for pacman (x86_64)" tobii-linux-bin-*-x86_64.pkg.tar.zst || bad=1
          one "PKGBUILD" PKGBUILD || bad=1
          one "PKGBUILD install hook" tobii-linux.install || bad=1
          one "SHA256SUMS" SHA256SUMS || bad=1
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # For the maintainer: the PKGBUILD this release was tested with and its
      # .SRCINFO. aur.yml regenerates both from the published release rather
      # than trusting this artifact; this is what to compare them against.
      - name: Keep the .SRCINFO beside its PKGBUILD
        run: cp /home/builder/pkg/.SRCINFO aur/tobii-linux-bin/.SRCINFO

      - uses: actions/upload-artifact@v4
        with:
          name: aur-bin
          path: aur/
          # .SRCINFO starts with a dot, and upload-artifact skips those unless told.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    # arch as well as build: arch adds the Arch package and writes the final
    # SHA256SUMS, and a release whose Arch package did not install is not one
    # to publish.
    needs: [build, arch]
    runs-on: ubuntu-latest
    # Not in the container: `gh` is preinstalled on the runner image, and
    # publishing needs no particular glibc.
    permissions:
      contents: write

    steps:
      # Needed for docs/releases/<tag>.md below — this job would otherwise have
      # only the downloaded artifacts and no repository at all.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: List what will be published
        run: ls -l dist

      # A draft, deliberately. The release notes are the changelog the updater
      # shows every user, and they are worth a human's eyes before they are
      # published — publishing is one click in the GitHub UI. It also means a
      # mistaken tag can be deleted without anyone's updater ever seeing it.
      # The hand-written notes, when there are any. These are the changelog
      # every user's updater shows them, so a list of commit subjects is a poor
      # substitute — `--generate-notes` is the fallback, not the intent.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          notes="docs/releases/${TAG}.md"
          # One invocation, with only the notes flag chosen by the branch. The
          # two copies differed in their last argument alone, which is the
          # shape where a fix lands in one of them.
          if [ -f "$notes" ]; then
            echo "using $notes"
            set -- --notes-file "$notes"
          else
            echo "::warning::no $notes — falling back to generated notes"
            set -- --generate-notes
          fi
          # A suffixed tag (v1.0.0-rc1) is a pre-release, and nothing but this
          # line marks it as one. The hub's release list (tobii-update's
          # parse_releases) and aur.yml skip only releases carrying the flag;
          # without it, publishing an rc draft fires `released`, and aur.yml
          # pushes it to every AUR user. The tag was validated in `build`, so
          # the only '-' it can contain is the suffix's. ci.yml runs this step
          # with a stand-in gh to check it.
          case "$TAG" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --draft "$@"
          echo "::notice::Draft release $TAG created. Review the notes and publish it."
